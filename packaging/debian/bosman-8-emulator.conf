# Konfiguracja emulatorów Bosman-8 / ANG-3001 (pakiet bosman8-emulator).
# Format: klucz = wartość, '#' zaczyna komentarz.
# Opcja --rom w linii poleceń ma pierwszeństwo przed tym plikiem.

# Obraz EPROM Bosmana-8 (32 KB, albo 64 KB z drugą połową wybieraną bitem Q0)
bosman8_rom = /usr/share/bosman8-emulator/roms/bosman8/bosman8.bin

# Obraz EPROM terminala ANG-3001 (16 KB); bez tego klucza — ROM wbudowany w program
ang3001_rom = /usr/share/bosman8-emulator/roms/ang3001/ANG-3001_90.09.11.BIN
